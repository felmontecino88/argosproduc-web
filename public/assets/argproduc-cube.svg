<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Borde exterior hexágono rosado -->
  <polygon points="50,10 85,30 85,70 50,90 15,70 15,30" stroke="#B84256" stroke-width="8" stroke-linejoin="round" fill="none"/>
  <!-- Cara izquierda (morada oscura) -->
  <polygon points="50,50 22,34 22,66 50,82" fill="#2A1B4E"/>
  <!-- Cara derecha (azul noche/oscura) -->
  <polygon points="50,50 78,34 78,66 50,82" fill="#1C1438"/>
  <!-- Cara superior (sombra intermedia) -->
  <polygon points="50,50 22,34 50,18 78,34" fill="#3D255A"/>
</svg>
